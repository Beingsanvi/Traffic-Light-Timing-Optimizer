<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartFlow | Create Account</title>


    <!-- Global CSS -->
    <link
        rel="stylesheet"
        href="../Css/global.css"
    >


    <!-- Authentication CSS -->
    <link
        rel="stylesheet"
        href="../Css/auth.css"
    >

</head>


<body>

    <!-- =========================================
         AUTHENTICATION PAGE
    ========================================== -->

    <div class="auth-page">


        <!-- Background -->
        <div class="auth-background"></div>


        <!-- =====================================
             SMARTFLOW LOGO
        ====================================== -->

        <a
            href="index.html"
            class="auth-logo"
        >

            <img
                src="../Assets/Logo/SmartFlow-logo.png"
                alt="SmartFlow Logo"
            >

        </a>


        <!-- =====================================
             SIGNUP CARD
        ====================================== -->

        <div class="auth-card">


            <!-- HEADER -->

            <div class="auth-header">

                <span class="auth-tag">
                    SMART TRAFFIC CONTROL
                </span>


                <h1>
                    Create Account
                </h1>


                <p>
                    Create your SmartFlow account
                    to access the control center.
                </p>

            </div>



            <!-- =================================
                 SIGNUP FORM
            ================================== -->

            <form id="signupForm">


                <!-- FULL NAME -->

                <div class="input-group">

                    <label for="name">
                        FULL NAME
                    </label>


                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="input-group">

                    <label for="signupEmail">
                        EMAIL ADDRESS
                    </label>


                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="signupPassword">
                        PASSWORD
                    </label>


                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- =================================
                     SIGNUP MESSAGE
                ================================== -->

                <div
                    id="signupMessage"
                    class="auth-message"
                ></div>



                <!-- =================================
                     CREATE ACCOUNT BUTTON
                ================================== -->

                <button
                    type="submit"
                    class="auth-submit"
                >

                    CREATE SMARTFLOW ACCOUNT

                    <span>
                        →
                    </span>

                </button>

            </form>



            <!-- =================================
                 DIVIDER
            ================================== -->

            <div class="auth-divider">

                <span>
                    OR
                </span>

            </div>



            <!-- =================================
                 LOGIN LINK
            ================================== -->

            <div class="signup-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </div>



            <!-- =================================
                 SECURITY STATUS
            ================================== -->

            <div class="secure-login">

                <span class="secure-dot"></span>

                SECURE SMARTFLOW CONNECTION

            </div>

        </div>

    </div>



    <!-- =========================================
         AUTHENTICATION JAVASCRIPT
    ========================================== -->

    <script src="../Js/auth.js"></script>

</body>

</html>
